name: Verification scripts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --python 3.12 --extra dev
      - run: uv run ruff check script tests ChatRoom
      - run: uv run ruff format --check script tests ChatRoom
      - run: uv run pytest -q
      - run: uv run python -m script.evaluate
