[project]
name = "anti-scam-radar"
version = "0.1.0"
description = "Evidence-based Taiwan anti-scam verification scripts"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "tldextract>=5.1,<6",
    "beautifulsoup4>=4.12,<5",
    "openai>=1.66,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]
images = ["Pillow>=11,<13", "zxing-cpp>=2.2,<4", "pytesseract>=0.3.13,<1"]
browser = ["playwright>=1.52,<2"]

[project.scripts]
scam-radar = "script.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["script*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.setuptools.package-data]
script = ["data/*.json"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
