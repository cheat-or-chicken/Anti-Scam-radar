<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>詐騙劇本雷達 · 對話重播</title>
<style>
:root{color-scheme:dark;font-family:system-ui,"Microsoft JhengHei",sans-serif;background:#101626;color:#e9eef7}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;padding:24px}header{max-width:1300px;margin:auto auto 20px;display:flex;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0 0 8px}h2{font-size:18px;margin:0 0 12px}.muted{color:#a7b5cb;font-size:13px}main{max-width:1300px;margin:auto;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:20px}.card{background:#192237;border:1px solid #334057;border-radius:16px;padding:20px}.chat{height:68vh;display:flex;flex-direction:column}#messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:15px 0;min-height:200px}.bubble{max-width:86%;padding:12px 16px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;background:#2b3852;line-height:1.6}.mine{align-self:flex-end;background:#373e83}.speaker{display:block;font-size:12px;color:#c6d5e8;margin-bottom:5px}.divider{text-align:center;color:#9ab9cc;font-size:12px;margin:10px}.attachment{font-size:12px;border-top:1px solid #718096;padding-top:8px;margin-top:8px}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}select,input,button{font:inherit;font-size:14px;padding:10px;border-radius:8px;border:1px solid #53617a;background:#101a2d;color:#eef}button{cursor:pointer;background:#365cf2}button:disabled{opacity:.5;cursor:default}input[type=file]{max-width:100%}#messageInput{flex:1;min-width:80px}.demo-controls{grid-column:1/-1;padding:16px 20px}.control-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.control-heading h2{margin:0;font-size:15px}.playback-controls{align-items:center}.playback-controls select{flex:1;min-width:180px;max-width:100%}.control-separator{height:28px;border-left:1px solid #334057;margin:0 4px}.secondary{background:#243149}.extra-controls summary{cursor:pointer;color:#a7b5cb;font-size:13px}.extra-controls .controls{margin:12px 0 0;align-items:center}.chat>h2{padding-bottom:14px;border-bottom:1px solid #334057;overflow-wrap:anywhere}.chat-empty{margin:auto;text-align:center}.panel{display:flex;flex-direction:column;gap:16px}.warning{border-color:#f59e66;background:#3b2726}#verdict{font-size:22px;font-weight:700;margin-bottom:12px}#reason{line-height:1.65}blockquote{margin:8px 0;padding-left:10px;border-left:2px solid #8296b8;color:#cdd9e8;font-size:14px}.prediction{padding:10px 0;border-bottom:1px solid #3c475c}.badge{display:inline-block;background:#293a55;padding:4px 8px;border-radius:6px;margin:4px}.error{color:#ffbba7}@media(max-width:850px){body{padding:12px}main{grid-template-columns:1fr}.chat{height:72vh}header{flex-direction:column}}
.link-card{border:1px solid #53617a;border-radius:12px;padding:14px;margin:12px 0;overflow-wrap:anywhere}.link-card ul{padding-left:20px}.link-card li{margin:8px 0}
</style>
</head>
<body>
<header><div><h1>詐騙劇本雷達</h1><div class="muted">逐則理解對話 · 保留判斷依據 · 預測後續要求</div></div><div id="connection" class="muted">確認分析服務…</div></header>
<main>
<section class="card demo-controls" aria-labelledby="controlsTitle">
<div class="control-heading"><h2 id="controlsTitle">Demo 操作</h2><div id="status" class="muted" role="status">尚未載入</div></div>
<div class="controls playback-controls"><select id="sample" aria-label="選取內建案例"><option value="">選取內建案例</option></select><button id="loadSample">載入</button><span class="control-separator" aria-hidden="true"></span><button id="next" disabled>下一則</button><button id="auto" disabled>自動重播</button><button id="reset" class="secondary" disabled>重新開始</button><button id="retry" class="secondary" disabled>重試本輪分析</button></div>
<details class="extra-controls"><summary>匯入與匯出</summary><div class="controls"><input id="textFile" type="file" accept=".json,.txt" aria-label="匯入對話檔案"><button id="export" class="secondary" disabled>匯出分析紀錄</button><span class="muted">支援 JSON 完整對話或 TXT 對方訊息</span></div></details>
</section>
<section class="card chat" aria-label="聊天室">
<h2 id="chatTitle">聊天室</h2>
<div id="messages" aria-live="polite"><p class="muted chat-empty">對話將顯示於此</p></div>
<form id="sendForm" class="controls" hidden><input id="messageInput" type="text" placeholder="輸入你的回覆" aria-label="你的回覆" disabled><button id="send" disabled>傳送</button></form>
</section>
<aside class="panel">
<section class="card"><h2>訊息網址即時查核</h2><p class="muted">訊息中的 http(s)／www／一般網域網址會自動讀取公開頁面，不必先點開。</p><div id="linkChecks" aria-live="polite"></div></section>
<section id="decisionCard" class="card" hidden><h2>防詐判斷</h2><div id="verdict">等待對話</div><div id="reason">分析只使用已播放的訊息。</div><div id="advice"></div><div id="evidence"></div><div id="stages"></div><p id="firstAlert" class="muted">尚無示警</p></section>
<section id="predictionCard" class="card" hidden><h2>下一步預測</h2><div id="predictions" class="muted">有足夠依據時才預測；一般交易不強行預測詐騙。</div></section>

</aside>
</main>
<script type="module" src="/app.js"></script>
</body></html>
